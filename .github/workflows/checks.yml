name: Participant helper checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  helpers:
    name: Helpers (${{ matrix.os }}, Python 3.11)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Runtime preflight (not app qualification)
        run: python tools/preflight.py
      - name: Helper positive and failure-path tests (not participant app tests)
        run: python -m unittest discover -s tests -v
