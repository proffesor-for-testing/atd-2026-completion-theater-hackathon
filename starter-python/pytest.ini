[pytest]
testpaths = tests
pythonpath = . tests
python_files = test_*.py
addopts = -ra --strict-markers -n auto
markers =
    unit: tests of one code module, mirrored by file name under tests/unit/
    acceptance: PRD acceptance criteria, run against the app as a real process
    integration: two or more pieces joined together (storage, app process, error path to the UI)
