<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Seat Desk</title>
<style>
  @font-face { font-family: 'Bricolage'; src: url('/fonts/bricolage.woff2') format('woff2'); font-weight: 200 800; font-display: swap; }
  @font-face { font-family: 'DM Sans'; src: url('/fonts/dm-sans.woff2') format('woff2'); font-weight: 100 1000; font-display: swap; }
  :root {
    --ink: #141414; --bg: #f5f4f1; --white: #fff; --line: #dedbd4; --muted: #555;
    --red: #e3262f; --red-text: #8a0f15; --red-bg: #fff1f1;
    --sun: #ffd21f; --green: #2db665; --green-bg: #eefaf2; --blue: #1e5bd8;
    --shadow: 5px 5px 0 var(--ink); --shadow-sm: 3px 3px 0 var(--ink);
    --font-h: 'Bricolage', 'Arial Black', system-ui, sans-serif;
    --font-b: 'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --pad: clamp(16px, 4vw, 48px);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 400 17px/1.5 var(--font-b); }
  main { max-width: 68rem; margin: 0 auto; padding: clamp(24px, 4vw, 40px) var(--pad) 64px; }
  h1, h2 { font-family: var(--font-h); font-weight: 800; letter-spacing: -0.02em; line-height: 1; margin: 0; }
  :focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  .mast { display: flex; justify-content: space-between; align-items: end; gap: 16px; flex-wrap: wrap; margin-bottom: clamp(28px, 5vw, 48px); }
  .eyebrow { display: inline-block; font: 700 13px var(--font-b); letter-spacing: .08em; text-transform: uppercase; background: var(--sun); border: 2px solid var(--ink); padding: 4px 10px; margin-bottom: 14px; }
  h1 { font-size: clamp(36px, 6vw, 64px); }
  .live { font: 600 14px var(--font-b); color: var(--muted); display: flex; align-items: center; gap: 10px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--green); border: 2px solid var(--ink); }
  .dot.off { background: var(--red); }

  .sessions { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 24px; margin-bottom: 40px; }
  .card { background: var(--white); border: 2px solid var(--ink); box-shadow: var(--shadow); padding: 22px 24px 24px; position: relative; }
  .card .id { font: 700 13px var(--font-b); letter-spacing: .06em; }
  .card h2 { font-size: clamp(22px, 2.6vw, 28px); margin: 6px 0 18px; padding-right: 64px; }
  .big { display: flex; align-items: baseline; gap: 10px; }
  .big b { font: 800 clamp(64px, 10vw, 96px)/.9 var(--font-h); letter-spacing: -0.04em; }
  .big span { font: 600 15px var(--font-b); color: var(--muted); }
  .card.full .big b { color: var(--red); }
  .seats { display: flex; gap: 8px; margin: 18px 0 10px; }
  .seat { flex: 1; height: 14px; border: 2px solid var(--ink); background: var(--white); }
  .seat.taken { background: var(--ink); }
  .stats { display: flex; gap: 20px; margin: 0; font-size: 13px; color: var(--muted); }
  .stats div { display: flex; gap: 6px; }
  .stats dt { margin: 0; } .stats dd { margin: 0; font-weight: 700; color: var(--ink); }
  .stamp { position: absolute; top: 18px; right: 18px; font: 800 13px var(--font-h); letter-spacing: .06em; text-transform: uppercase; background: var(--red); color: #fff; border: 2px solid var(--ink); padding: 4px 9px; transform: rotate(3deg); }

  .panel { background: var(--white); border: 2px solid var(--ink); box-shadow: var(--shadow); padding: clamp(20px, 3vw, 28px); margin-bottom: 40px; }
  .panel h2 { font-size: 26px; margin-bottom: 18px; }
  .book { display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: end; }
  @media (max-width: 720px) { .book { grid-template-columns: 1fr; } }
  fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
  legend, label { display: block; font: 700 13px var(--font-b); letter-spacing: .06em; text-transform: uppercase; margin-bottom: 8px; padding: 0; }
  .seg { display: flex; border: 2px solid var(--ink); width: max-content; max-width: 100%; }
  .seg label { margin: 0; letter-spacing: 0; text-transform: none; font: 700 16px var(--font-b); }
  .seg input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .seg span { display: block; padding: 0 18px; height: 50px; line-height: 50px; cursor: pointer; background: var(--white); white-space: nowrap; }
  .seg label + label span { border-left: 2px solid var(--ink); }
  .seg input:checked + span { background: var(--ink); color: #fff; }
  .seg input:focus-visible + span { outline: 3px solid var(--blue); outline-offset: -5px; }
  .seg input:checked:focus-visible + span { outline-color: var(--sun); }
  input[type=text] { width: 100%; height: 54px; font: 600 18px var(--font-b); padding: 0 16px; border: 2px solid var(--ink); background: var(--white); color: var(--ink); border-radius: 0; }
  input[type=text]::placeholder { color: #75736d; font-weight: 400; }
  input[aria-invalid=true] { border-color: var(--red); box-shadow: inset 0 0 0 2px var(--red); }
  .btn { height: 54px; padding: 0 26px; font: 800 18px var(--font-h); letter-spacing: .01em; background: var(--red); color: #fff; border: 2px solid var(--ink); box-shadow: var(--shadow-sm); cursor: pointer; transition: transform .08s, box-shadow .08s, background .12s; border-radius: 0; }
  .btn:hover { background: var(--sun); color: var(--ink); }
  .btn:active { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--ink); }
  .btn:disabled { opacity: .5; cursor: wait; }
  .btn.ghost { background: var(--white); color: var(--ink); height: 42px; padding: 0 16px; font: 700 15px var(--font-b); }
  .btn.ghost:hover { background: var(--sun); }
  details { margin-top: 14px; font-size: 14px; color: var(--muted); }
  summary { cursor: pointer; font-weight: 600; width: max-content; }
  details[open] summary { margin-bottom: 8px; }
  details input[type=text] { height: 42px; font: 500 14px ui-monospace, Menlo, monospace; max-width: 34rem; }

  .msg { margin-top: 18px; padding: 12px 16px; border: 2px solid var(--ink); font-weight: 600; }
  .msg:empty { display: none; }
  .msg.ok { background: var(--green-bg); }
  .msg.error { background: var(--red-bg); color: var(--red-text); }
  .msg:focus { outline: 3px solid var(--blue); outline-offset: 2px; }

  .list-head { display: flex; justify-content: space-between; align-items: end; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
  .list-head h2 { font-size: 26px; }
  .find { display: flex; gap: 10px; align-items: end; }
  .find input[type=text] { height: 42px; font-size: 15px; width: 14rem; }
  ul.res { list-style: none; margin: 0; padding: 0 20px; background: var(--white); border: 2px solid var(--ink); box-shadow: var(--shadow); }
  ul.res li:last-child { border-bottom: 0; }
  .res .btn.ghost { box-shadow: none; }
  ul.res li { display: grid; grid-template-columns: minmax(0, 1fr) auto 7rem; gap: 16px; align-items: center; padding: 14px 4px; border-bottom: 1px solid var(--line); }
  ul.res li.empty { display: block; color: var(--muted); padding: 22px 4px; }
  .who { font: 800 22px/1.1 var(--font-h); letter-spacing: -0.01em; overflow-wrap: anywhere; }
  .rid { display: block; font: 400 12px ui-monospace, Menlo, monospace; color: var(--muted); margin-top: 4px; overflow-wrap: anywhere; }
  .meta { display: flex; gap: 8px; }
  .act { text-align: right; }
  .tag { font: 700 13px var(--font-b); border: 2px solid var(--ink); padding: 3px 8px; white-space: nowrap; }
  .tag.active { background: var(--white); }
  .tag.cancelled { background: var(--white); color: var(--muted); border-color: var(--muted); text-decoration: line-through; }
  @media (max-width: 560px) { ul.res li { grid-template-columns: 1fr auto; } ul.res li .act { grid-column: 1 / -1; text-align: left; } }

  .room { height: clamp(300px, 44vw, 500px); margin: 0 0 32px; background: var(--white); border: 2px solid var(--ink); box-shadow: var(--shadow);
    background-image: radial-gradient(var(--line) 1.2px, transparent 1.2px); background-size: 22px 22px; }
  .room canvas { display: block; width: 100%; height: 100%; }
  .person { display: flex; align-items: center; gap: 14px; min-width: 0; }
  .avatar { flex: none; display: block; }
  .who-btn { all: unset; cursor: pointer; font: 800 22px/1.1 var(--font-h); letter-spacing: -0.01em; overflow-wrap: anywhere; border-bottom: 2px solid transparent; }
  .who-btn:hover { border-bottom-color: var(--ink); }
  .who-btn:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }
  dialog.profile { border: 2px solid var(--ink); box-shadow: 8px 8px 0 var(--ink); padding: 0; width: min(28rem, calc(100vw - 32px)); background: var(--white); color: var(--ink); }
  dialog.profile::backdrop { background: rgba(20, 20, 20, .45); }
  .profile-head { display: flex; align-items: center; gap: 18px; padding: 24px 24px 18px; background: var(--bg); border-bottom: 2px solid var(--ink); }
  .profile-head h2 { font-size: 34px; overflow-wrap: anywhere; }
  .profile-head p { margin: 4px 0 0; font-size: 14px; color: var(--muted); }
  .profile-body { padding: 18px 24px 24px; }
  .profile-body ul { list-style: none; margin: 0 0 18px; padding: 0; }
  .profile-body li { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .profile-body li:last-child { border-bottom: 0; }
  .profile-body .sess { font-weight: 700; }
  .profile-body .title { display: block; font-size: 13px; color: var(--muted); }

  /* ---------- Immersive mode: only when the 3D room mounted (no WebGL = classic layout) ---------- */
  body.immersive { overflow: hidden; }
  body.immersive main { max-width: none; padding: 0; }
  body.immersive .room { position: fixed; inset: 0; height: auto; margin: 0; border: 0; box-shadow: none; z-index: 0;
    background: var(--bg) radial-gradient(circle, rgba(20,20,20,.13) 1px, transparent 1.4px) 0 0 / 22px 22px; }
  body.immersive .mast { position: fixed; top: 0; left: 0; right: 0; z-index: 3; padding: 22px 28px; margin: 0; align-items: flex-start; pointer-events: none; }
  body.immersive .mast > * { pointer-events: auto; }
  body.immersive #conn-msg { position: fixed; top: 96px; left: 50%; transform: translateX(-50%); z-index: 4; max-width: min(36rem, calc(100vw - 32px)); }
  body.immersive #conn-msg:empty { display: none; }
  body.immersive .sessions { display: block; margin: 0; }
  body.immersive .card { position: fixed; z-index: 2; width: 230px; padding: 14px 16px; transform: translate(-50%, -100%); left: -999px; top: -999px; }
  body.immersive .card h2 { font-size: 18px; margin: 4px 0 8px; padding-right: 54px; }
  body.immersive .card .big b { font-size: 46px; }
  body.immersive .card .stats { display: none; }
  body.immersive .card .stamp { top: 12px; right: 12px; font-size: 11px; }
  body.immersive .panel { position: fixed; z-index: 3; left: 50%; bottom: 22px; transform: translateX(-50%); width: min(820px, calc(100vw - 32px)); margin: 0; padding: 16px 20px; }
  body.immersive .panel h2 { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  body.immersive #reserve-msg { margin-top: 10px; }
  body.immersive #reserve-msg:empty { display: none; }
  body.immersive .people { position: fixed; z-index: 5; top: 0; right: 0; bottom: 0; width: min(420px, 100vw); background: var(--white); border-left: 2px solid var(--ink);
    box-shadow: -6px 0 0 var(--ink); padding: 24px 22px; overflow-y: auto; transform: translateX(110%); transition: transform .28s cubic-bezier(.2,.8,.2,1); visibility: hidden; }
  body.immersive.drawer-open .people { transform: none; visibility: visible; }
  body.immersive .people .list-head { flex-direction: column; align-items: stretch; }
  body.immersive .people .res li { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; }
  body.immersive .people .res li > .person { flex: 1 1 100%; }
  body.immersive .people .res li > :last-child { margin-left: auto; }
  body.immersive .people .rid { font-size: 11px; word-break: break-all; }
  body.immersive .people .find { width: 100%; }
  body.immersive .people .find > div { flex: 1; }
  body.immersive .people .find input { width: 100%; }
  #people-toggle, #people-close { display: none; }
  body.immersive #people-toggle { display: inline-block; }
  body.immersive #people-close { display: block; margin-left: auto; margin-bottom: 8px; }
  body.immersive footer { position: fixed; z-index: 2; left: 28px; bottom: 4px; margin: 0; border: 0; padding: 0; opacity: .7; }
  @media (max-width: 760px) {
    body.immersive { overflow: auto; }
    body.immersive .room { position: sticky; top: 0; height: 52vh; inset: auto; }
    body.immersive .mast { position: absolute; padding: 14px 16px; }
    body.immersive .card { width: 160px; padding: 10px 12px; }
    body.immersive .card h2 { display: none; }
    body.immersive .card .big b { font-size: 34px; }
    body.immersive .panel { position: relative; left: auto; bottom: auto; transform: none; margin: 16px auto 32px; }
    body.immersive footer { position: static; padding: 0 16px 24px; }
  }
  @media (prefers-reduced-motion: reduce) { body.immersive .people { transition: none; } }
  footer { margin-top: 56px; padding-top: 16px; border-top: 2px solid var(--ink); display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; font: 400 12px ui-monospace, Menlo, monospace; color: var(--muted); }
  footer span { overflow-wrap: anywhere; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main>
  <header class="mast">
    <div>
      <span class="eyebrow">Agile Testing Days 2026</span>
      <h1>Seat Desk</h1>
    </div>
    <div class="live"><span class="dot" id="conn-dot" aria-hidden="true"></span><span id="sessions-updated">Connecting…</span><span id="conn-live" class="sr-only" aria-live="polite"></span>
      <button type="button" class="btn ghost" id="refresh-btn">Refresh</button>
      <button type="button" class="btn ghost" id="people-toggle" aria-expanded="false" aria-controls="people">Reservations</button></div>
  </header>
  <div id="conn-msg" class="msg" tabindex="-1"></div>

  <div class="room" id="room" hidden><canvas aria-hidden="true"></canvas></div>

  <section aria-labelledby="sessions-h">
    <h2 id="sessions-h" class="sr-only">Sessions</h2>
    <div class="sessions" id="sessions-body"></div>
  </section>

  <section class="panel" aria-labelledby="reserve-h">
    <h2 id="reserve-h">Reserve a seat</h2>
    <form id="reserve-form" novalidate>
      <div class="book">
        <fieldset>
          <legend>Session</legend>
          <div class="seg" id="session-seg"></div>
        </fieldset>
        <div>
          <label for="alias">Attendee alias</label>
          <input type="text" id="alias" name="attendeeAlias" autocomplete="off" maxlength="200" placeholder="e.g. Ada" required>
        </div>
        <button type="submit" class="btn" id="reserve-btn">Reserve</button>
      </div>
      <details>
        <summary>Request key</summary>
        <label for="key" class="sr-only">Request key</label>
        <input type="text" id="key" name="requestKey" autocomplete="off" maxlength="200" aria-describedby="key-hint">
        <p id="key-hint" style="margin:.4rem 0 0">Kept until the server confirms, so a double-click or retry never books twice.</p>
      </details>
    </form>
    <div id="reserve-msg" class="msg" tabindex="-1" aria-live="polite"></div>
  </section>

  <section aria-labelledby="list-h" class="people" id="people">
    <button type="button" class="btn ghost" id="people-close">Close</button>
    <div class="list-head">
      <h2 id="list-h">Reservations</h2>
      <form id="find-form" class="find" role="search">
        <div>
          <label for="find-alias">Find attendee</label>
          <input type="text" id="find-alias" autocomplete="off" placeholder="Alias">
        </div>
        <button type="submit" class="btn ghost">Find</button>
      </form>
    </div>
    <ul class="res" id="res-body"></ul>
    <div id="list-msg" class="msg" tabindex="-1" aria-live="polite"></div>
  </section>

  <dialog class="profile" id="profile" aria-labelledby="profile-name">
    <div class="profile-head"><span id="profile-avatar"></span><div><h2 id="profile-name"></h2><p id="profile-sub"></p></div></div>
    <div class="profile-body">
      <ul id="profile-list"></ul>
      <form method="dialog"><button class="btn ghost" id="profile-close">Close</button></form>
    </div>
  </dialog>

  <footer><span id="store-info"></span></footer>
</main>
<script>
'use strict';
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text !== undefined) n.textContent = text; return n; };
const newKey = () => 'ui-' + (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2));
let selected = null;
let titles = {};
let anchors = {};
function hangCards(a) {
  if (a) anchors = a;
  if (!document.body.classList.contains('immersive')) return;
  for (const card of document.querySelectorAll('#sessions-body .card')) {
    const p = anchors[card.dataset.session];
    if (p) { card.style.left = Math.round(p.x) + 'px'; card.style.top = Math.round(p.y) + 'px'; }
  }
}
function setDrawer(open) {
  document.body.classList.toggle('drawer-open', open);
  $('people-toggle').setAttribute('aria-expanded', String(open));
  if (open) $('find-alias').focus(); else $('people-toggle').focus();
}

// Generated avatar: deterministic from the alias, drawn as SVG. No photos, no uploads, no personal data.
const SVG = 'http://www.w3.org/2000/svg';
const PALETTE = ['#ffd21f', '#e3262f', '#1e7bff', '#2db665', '#ff8a1e', '#c6f01e', '#fff6da', '#b9a7ff'];
function hash(str) { let h = 2166136261; for (const ch of str) { h ^= ch.codePointAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function avatar(alias, size) {
  const h = hash(alias);
  const pick = (n, shift) => (h >>> shift) % n;
  const bg = PALETTE[pick(PALETTE.length, 0)];
  const dark = ['#e3262f', '#1e7bff'].includes(bg);
  const ink = '#141414', face = dark ? '#ffffff' : ink;
  const s = document.createElementNS(SVG, 'svg');
  s.setAttribute('viewBox', '0 0 64 64'); s.setAttribute('width', size); s.setAttribute('height', size);
  s.setAttribute('class', 'avatar'); s.setAttribute('aria-hidden', 'true');
  const add = (tag, attrs) => { const n = document.createElementNS(SVG, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); s.append(n); return n; };
  add('circle', { cx: 32, cy: 32, r: 30, fill: bg, stroke: ink, 'stroke-width': 3 });
  const eyeY = 26 + pick(4, 3), gap = 9 + pick(4, 5);
  const eyes = pick(4, 7);
  for (const x of [32 - gap, 32 + gap]) {
    if (eyes === 0) add('circle', { cx: x, cy: eyeY, r: 3.2, fill: face });
    else if (eyes === 1) add('circle', { cx: x, cy: eyeY, r: 2.4, fill: face });
    else if (eyes === 2) add('path', { d: `M${x - 4} ${eyeY + 1} q4 -6 8 0`, fill: 'none', stroke: face, 'stroke-width': 3, 'stroke-linecap': 'round' });
    else { add('circle', { cx: x, cy: eyeY, r: 5, fill: '#fff', stroke: ink, 'stroke-width': 2 }); add('circle', { cx: x + 1, cy: eyeY + 1, r: 2, fill: ink }); }
  }
  const mouth = pick(4, 9), my = 42 + pick(3, 11);
  const m = { fill: 'none', stroke: face, 'stroke-width': 3, 'stroke-linecap': 'round' };
  // every mouth is a smile, just in different styles (no flat, wavy or 'o' mouths: they read as sad)
  if (mouth === 0) add('path', { d: `M22 ${my} q10 9 20 0`, ...m });
  else if (mouth === 1) add('path', { d: `M21 ${my - 1} q11 12 22 0 z`, fill: face, stroke: face, 'stroke-width': 2, 'stroke-linejoin': 'round' });
  else if (mouth === 2) add('path', { d: `M25 ${my} q7 6 14 0`, ...m });
  else { add('path', { d: `M21 ${my - 1} q11 12 22 0 z`, fill: face, stroke: face, 'stroke-width': 2, 'stroke-linejoin': 'round' }); add('circle', { cx: 32, cy: my + 4, r: 2.6, fill: '#e3262f' }); }
  if (pick(3, 13) === 0) add('path', { d: 'M14 16 q18 -16 36 0', fill: 'none', stroke: ink, 'stroke-width': 5, 'stroke-linecap': 'round' });
  return s;
}

async function openProfile(alias) {
  const dlg = $('profile');
  $('profile-avatar').replaceChildren(avatar(alias, 84));
  $('profile-name').textContent = alias;
  $('profile-sub').textContent = 'Loading…';
  $('profile-list').replaceChildren();
  if (!dlg.open) dlg.showModal();
  const r = await api('GET', '/reservations?alias=' + encodeURIComponent(alias));
  if (!r.ok || !r.data || !Array.isArray(r.data.reservations)) { $('profile-sub').textContent = errorText(r.data, r.status); return; }
  const rows = r.data.reservations;
  const active = rows.filter((x) => x.status === 'active').length;
  $('profile-sub').textContent = active + ' active · ' + (rows.length - active) + ' cancelled';
  $('profile-list').replaceChildren(...rows.map((res) => {
    const li = el('li'); const left = el('div');
    left.append(el('span', 'sess', res.sessionId), el('span', 'title', titles[res.sessionId] || ''));
    li.append(left, el('span', 'tag ' + res.status, res.status));
    return li;
  }));
}

function show(node, text, kind) {
  node.textContent = text; node.className = 'msg' + (text ? ' ' + kind : '');
  node.setAttribute('role', kind === 'error' ? 'alert' : 'status');
}
function errorText(body, status) {
  const e = body && body.error;
  if (!e) return 'Request failed (HTTP ' + status + ').';
  return typeof e === 'string' ? e : (e.message || e.code || 'Request failed');
}
async function api(method, path, body) {
  const res = await fetch(path, {method, headers: {'Content-Type': 'application/json'}, body: body === undefined ? undefined : JSON.stringify(body), cache: 'no-store'});
  let data = null;
  try { data = await res.json(); } catch (_) { /* non-JSON */ }
  return {ok: res.ok, status: res.status, data};
}

async function loadSessions() {
  const r = await api('GET', '/sessions');
  const box = $('sessions-body');
  if (!r.ok || !r.data || !Array.isArray(r.data.sessions)) { box.replaceChildren(el('p', null, errorText(r.data, r.status))); return; }
  const cards = [], seg = [];
  if (!r.data.sessions.some((s) => s.id === selected)) {
    const open = r.data.sessions.find((s) => s.remainingSeats > 0) || r.data.sessions[0];
    selected = open ? open.id : null;
  }
  for (const s of r.data.sessions) {
    const full = s.remainingSeats === 0;
    const card = el('article', 'card' + (full ? ' full' : ''));
    card.dataset.session = s.id;
    card.setAttribute('aria-label', s.id + ' ' + s.title + ': ' + s.remainingSeats + ' of ' + s.capacity + ' seats left');
    card.append(el('div', 'id', s.id), el('h2', null, s.title));
    const big = el('div', 'big'); const b = el('b', null, String(s.remainingSeats)); b.dataset.field = 'remaining';
    big.append(b, el('span', null, s.remainingSeats === 1 ? 'seat left' : 'seats left'));
    const seats = el('div', 'seats'); seats.setAttribute('aria-hidden', 'true');
    for (let i = 0; i < s.capacity; i++) seats.append(el('span', 'seat' + (i < s.activeCount ? ' taken' : '')));
    const dl = el('dl', 'stats');
    for (const [k, v, f] of [['Capacity', s.capacity, 'capacity'], ['Booked', s.activeCount, 'active']]) {
      const d = el('div'); const dd = el('dd', null, String(v)); dd.dataset.field = f; d.append(el('dt', null, k), dd); dl.append(d);
    }
    card.append(big, seats, dl);
    if (full) card.append(el('span', 'stamp', 'Full'));
    cards.push(card);
    const lab = el('label'); const inp = el('input'); inp.type = 'radio'; inp.name = 'sessionId'; inp.value = s.id;
    inp.checked = s.id === selected;
    inp.addEventListener('change', () => { selected = s.id; });
    lab.append(inp, el('span', null, s.id + (full ? ' · full' : '')));
    seg.push(lab);
  }
  lastSessions = r.data.sessions;
  titles = Object.fromEntries(r.data.sessions.map((s) => [s.id, s.title]));
  box.replaceChildren(...cards);
  hangCards();
  const focusedSeg = document.activeElement && document.activeElement.name === 'sessionId';
  $('session-seg').replaceChildren(...seg);
  if (focusedSeg) { const c = $('session-seg').querySelector('input:checked'); if (c) c.focus(); }
  $('sessions-updated').textContent = 'Live · read ' + new Date().toLocaleTimeString();
  if ($('conn-dot').classList.contains('off') || !$('conn-live').textContent) $('conn-live').textContent = 'Connected to server';
  $('conn-dot').classList.remove('off');
}

async function loadReservations() {
  const alias = $('find-alias').value.trim();
  const r = await api('GET', '/reservations' + (alias ? '?alias=' + encodeURIComponent(alias) : ''));
  const list = $('res-body');
  if (!r.ok || !r.data || !Array.isArray(r.data.reservations)) { list.replaceChildren(); show($('list-msg'), errorText(r.data, r.status), 'error'); return; }
  if (!r.data.reservations.length) { list.replaceChildren(el('li', 'empty', alias ? 'No reservations for “' + alias + '”.' : 'No reservations yet.')); return; }
  list.replaceChildren(...r.data.reservations.slice().reverse().map((res) => {
    const li = el('li');
    const who = el('div', 'person');
    const name = el('button', 'who-btn', res.attendeeAlias); name.type = 'button';
    name.setAttribute('aria-label', 'Open profile for ' + res.attendeeAlias);
    name.addEventListener('click', () => openProfile(res.attendeeAlias));
    const text = el('div'); text.style.minWidth = '0'; text.append(name, el('code', 'rid', res.id));
    who.append(avatar(res.attendeeAlias, 44), text);
    const meta = el('div', 'meta');
    meta.append(el('span', 'tag', res.sessionId), el('span', 'tag ' + res.status, res.status));
    const act = el('div', 'act');
    if (res.status === 'active') {
      const b = el('button', 'btn ghost', 'Cancel'); b.type = 'button';
      b.setAttribute('aria-label', 'Cancel reservation for ' + res.attendeeAlias + ' in ' + res.sessionId);
      b.addEventListener('click', () => cancelReservation(res, b));
      act.append(b);
    }
    li.append(who, meta, act);
    return li;
  }));
}

async function loadHealth() {
  const r = await api('GET', '/health');
  if (r.ok) { $('store-info').title = r.data.store; $('store-info').textContent = String(r.data.store).split(/[\\/]/).pop() + ' · pid ' + r.data.pid + ' · ' + r.data.auditEntries + ' audited changes · ' + String(r.data.lastAuditHash).slice(0, 12); }
}
let room = null, lastSessions = null;
async function paintRoom() {
  if (!room || !lastSessions) return;
  const r = await api('GET', '/reservations');  // unfiltered: the room shows everyone, independent of the search box
  if (r.ok && r.data && Array.isArray(r.data.reservations)) room.render(lastSessions, r.data.reservations);
}
async function refresh() {
  try {
    await Promise.all([loadSessions(), loadReservations(), loadHealth()]);
    await paintRoom();
    show($('conn-msg'), '', '');
  } catch (e) {
    show($('conn-msg'), 'Cannot reach the server (' + e.message + '). Numbers on this page may be stale.', 'error');
    $('sessions-updated').textContent = 'Offline · last refresh failed ' + new Date().toLocaleTimeString();
    $('conn-dot').classList.add('off'); $('conn-live').textContent = 'Offline';
  }
}

async function cancelReservation(res, button) {
  button.disabled = true;
  try {
    const r = await api('POST', '/reservations/' + encodeURIComponent(res.id) + '/cancel', {});
    if (r.ok) show($('list-msg'), 'Cancelled ' + r.data.attendeeAlias + ' in ' + r.data.sessionId + '. Server status: ' + r.data.status + '.', 'ok');
    else show($('list-msg'), errorText(r.data, r.status), 'error');
  } catch (e) { show($('list-msg'), 'Network error: ' + e.message + '. Refresh to check the server state.', 'error'); }
  await refresh();
  $('list-msg').focus();
}

$('reserve-form').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const btn = $('reserve-btn'); const msg = $('reserve-msg'); const alias = $('alias');
  const payload = {sessionId: selected, attendeeAlias: alias.value, requestKey: $('key').value};
  alias.removeAttribute('aria-invalid');
  if (!payload.attendeeAlias.trim()) {
    show(msg, 'Enter an attendee alias.', 'error');
    alias.setAttribute('aria-invalid', 'true'); alias.setAttribute('aria-describedby', 'reserve-msg'); alias.focus(); return;
  }
  if (!payload.requestKey) { $('key').value = payload.requestKey = newKey(); }
  btn.disabled = true; show(msg, 'Reserving…', 'ok');
  try {
    const r = await api('POST', '/reservations', payload);
    if (r.ok) {
      const replay = r.status === 200;
      show(msg, (replay ? 'Already processed (same request key): ' : 'Reserved: ') + r.data.attendeeAlias + ' in ' + r.data.sessionId + ', status ' + r.data.status + '.', 'ok');
      $('key').value = newKey(); alias.value = ''; $('find-alias').value = '';
    } else {
      show(msg, errorText(r.data, r.status), 'error');
      msg.focus();
    }
  } catch (e) {
    show(msg, 'Network error: ' + e.message + '. Retry keeps the same request key, so it cannot double-book.', 'error');
  } finally { btn.disabled = false; }
  await refresh();
});
$('refresh-btn').addEventListener('click', refresh);
$('people-toggle').addEventListener('click', () => setDrawer(!document.body.classList.contains('drawer-open')));
$('people-close').addEventListener('click', () => setDrawer(false));
document.addEventListener('keydown', (ev) => {
  if (ev.key === 'Escape' && document.body.classList.contains('drawer-open') && !$('profile').open) setDrawer(false);
});
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
window.addEventListener('focus', refresh);
$('find-form').addEventListener('submit', (ev) => { ev.preventDefault(); show($('list-msg'), '', ''); loadReservations(); });

$('key').value = newKey();
refresh();

// Progressive enhancement: the 3D room loads after the 2D app and disappears silently if WebGL is unavailable.
(async () => {
  try {
    const mod = await import('/room.js');
    const holder = $('room');
    holder.hidden = false;
    holder.dataset.fit = 'full';
    document.body.classList.add('immersive');
    room = mod.mount(holder, { onLayout: hangCards, onPerson: (alias) => openProfile(alias), avatar: (alias) => { const s = avatar(alias, 128); s.setAttribute('xmlns', SVG); return { color: PALETTE[hash(alias) % PALETTE.length], svg: new XMLSerializer().serializeToString(s) }; }, onPick: (id) => {
      selected = id;
      const radio = $('session-seg').querySelector('input[value="' + CSS.escape(id) + '"]');
      if (radio) radio.checked = true;
      $('alias').focus();
    } });
    await paintRoom();
  } catch (e) {
    $('room').hidden = true; room = null;
    document.body.classList.remove('immersive', 'drawer-open');
    console.info('3D room unavailable; 2D app unaffected:', e && e.message);
  }
})();
</script>
</body>
